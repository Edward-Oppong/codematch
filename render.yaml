services:
  - type: web
    name: codematch
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: CODEMATCH_ALLOWED_HOSTS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CODEMATCH_HOST
        value: "0.0.0.0"
